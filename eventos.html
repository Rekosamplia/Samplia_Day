<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentos de marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  /*
   * Tarjetas animadas de días mundiales (datos en eventos.js).
   *   eventos.html                 → cuadrícula con todas las tarjetas animadas
   *   eventos.html?id=2026-10-31   → una tarjeta a pantalla completa
   *   …&still=1                    → animación congelada (para exportar imágenes)
   */
  :root { --bg: #0E0508; --ink: #FBF4F2; --muted: #B8949B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
  header { padding: 32px 16px 8px; max-width: 1200px; margin: 0 auto; }
  header h1 { font-family: Poppins, sans-serif; font-size: clamp(26px, 5vw, 44px); line-height: 1.1; }
  header p { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .seasons { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px 0; max-width: 1200px; margin: 0 auto; }
  .seasons span { background: #2A0E15; border-radius: 999px; padding: 8px 14px; font-size: 13px; color: #FFC9D2; }

  /* ---------- Tarjeta ---------- */
  .card { --w: 100%; position: relative; aspect-ratio: 1; border-radius: 6%; overflow: hidden; container-type: inline-size;
    background: linear-gradient(160deg, var(--c1), var(--c2)); color: var(--cink); }
  .card .glow { position: absolute; inset: 0; background: radial-gradient(55% 45% at 50% 34%, rgba(255,255,255,.28), transparent 70%); }
  .card svg.m { position: absolute; left: 50%; top: 6%; width: 58%; height: 58%; transform: translateX(-50%); overflow: visible; }
  .card .txt { position: absolute; left: 7%; right: 7%; bottom: 6.5%; display: flex; flex-direction: column; gap: 1.6cqw; }
  .card .date { align-self: flex-start; font: 700 3.6cqw/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase;
    padding: 1.6cqw 2.6cqw; border-radius: 99px; background: rgba(0,0,0,.22); }
  .card.light .date { background: rgba(255,255,255,.55); }
  .card .name { font: 700 6.4cqw/1.12 Poppins, sans-serif; letter-spacing: -.01em; text-wrap: balance; }
  .card .fit { font: 500 3.6cqw/1.3 Inter, sans-serif; opacity: .85; }
  .card .brand { position: absolute; right: 6%; top: 5.5%; height: 6.2cqw; width: auto; opacity: .95; }

  /* Vista individual */
  body.single { display: grid; place-items: center; height: 100vh; overflow: hidden; }
  body.single header, body.single .seasons { display: none; }
  body.single .grid { display: block; padding: 0; width: min(100vw, 100vh); }
  body.single .card { border-radius: 0; }
  /* Congelado para exportar: todas las animaciones en un punto fijo */
  body.still *, body.still *::before, body.still *::after { animation-play-state: paused !important; animation-delay: var(--still, -1.1s) !important; }

  /* ---------- Biblioteca de animaciones (SVG) ---------- */
  svg.m [class] { transform-box: fill-box; transform-origin: center; }
  .float  { animation: float 3s ease-in-out infinite; }
  .swing  { animation: swing 2.6s ease-in-out infinite; transform-origin: 50% 100% !important; }
  .spin   { animation: spin 6s linear infinite; }
  .rspin  { animation: spin 1.4s linear infinite reverse; }
  .rspin2 { animation: spin 8s linear infinite reverse; }
  .pulse  { animation: pulse 1.6s ease-in-out infinite; }
  .beat   { animation: beat 1.2s ease-in-out infinite; }
  .blink  { animation: blink 3.2s steps(1) infinite; }
  .twinkle{ animation: twinkle 1.8s ease-in-out infinite; }
  .flicker{ animation: flicker .9s ease-in-out infinite alternate; transform-origin: 50% 100% !important; }
  .rise   { animation: rise 2.4s ease-in infinite; }
  .steam  { stroke-dasharray: 60; animation: steam 2.4s ease-in-out infinite; }
  .draw   { stroke-dasharray: 600; animation: draw 3.6s ease-in-out infinite; }
  .bounce { animation: bounce 1.4s cubic-bezier(.3,0,.3,1) infinite; }
  .lid    { animation: lid 2s ease-in-out infinite; }
  .lift   { animation: lift 1.6s ease-in-out infinite; }
  .ripple { animation: ripple 2.4s ease-out infinite; }
  .grow   { animation: grow 2.8s ease-in-out infinite; transform-origin: 50% 100% !important; }
  .drop1  { animation: stack 2.8s ease-in-out infinite; }
  .fly    { animation: fly 4s ease-in-out infinite; }
  .neon   { animation: neon 2.2s linear infinite; }
  .slosh  { animation: slosh 2.4s ease-in-out infinite; transform-origin: 50% 0 !important; }
  .wave   { animation: wave 1.6s steps(1) infinite; }
  .d1 { animation-delay: -.3s; } .d2 { animation-delay: -.6s; } .d3 { animation-delay: -.9s; } .d4 { animation-delay: -1.2s; } .d5 { animation-delay: -1.5s; }
  @keyframes float { 50% { transform: translateY(-6%); } }
  @keyframes swing { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: .85; } }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @keyframes blink { 0%,90% { transform: scaleY(1); } 92%,96% { transform: scaleY(.1); } }
  @keyframes twinkle { 50% { transform: scale(.35) rotate(45deg); opacity: .4; } }
  @keyframes flicker { 0% { transform: scale(1,1) skewX(0); } 50% { transform: scale(.92,1.08) skewX(3deg); } 100% { transform: scale(1.05,.94) skewX(-3deg); } }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-260%) scale(1); opacity: 0; } }
  @keyframes steam { 0% { stroke-dashoffset: 60; opacity: 0; } 40% { opacity: .9; } 100% { stroke-dashoffset: -60; opacity: 0; } }
  @keyframes draw { 0% { stroke-dashoffset: 600; } 45%,75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1,1); } 45% { transform: translateY(-14%) scale(.96,1.04); } 85% { transform: translateY(0) scale(1.06,.94); } }
  @keyframes lid { 0%,40%,100% { transform: translateY(0) rotate(0); } 60% { transform: translateY(-30%) rotate(-10deg); } 75% { transform: translateY(-24%) rotate(6deg); } }
  @keyframes lift { 0%,100% { transform: translateY(18%); } 50% { transform: translateY(-18%); } }
  @keyframes ripple { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes grow { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.08); } }
  @keyframes stack { 0% { transform: translateY(-120%); opacity: 0; } 20%,85% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
  @keyframes fly { 0% { transform: translate(-60%, 20%) scale(.7); } 50% { transform: translate(40%, -30%) scale(1); } 100% { transform: translate(140%, 10%) scale(.7); } }
  @keyframes neon { 0%,18%,22%,62%,64%,100% { opacity: 1; filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 18px currentColor); } 20%,63% { opacity: .35; filter: none; } }
  @keyframes slosh { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  @keyframes wave { 0% { opacity: 1; } 25% { opacity: .15; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>

      <circle class="pulse" cx="100" cy="62" r="34" fill="rgba(255,190,90,.25)"/><path class="flicker" d="M100 36c12 16 14 26 14 32a14 14 0 0 1-28 0c0-6 2-16 14-32z" fill="#FFB43B"/>`,

  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

  const card = e => {
    const d = parse(e.date);
    const date = d.toLocaleDateString("es-ES", { day: "numeric", month: "short", weekday: "short" }).replace(",", " ·");
    const lum = hex => { const n = parseInt(hex.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255); };
    const lightBg = (lum(e.c1) + lum(e.c2)) / 2 > 150;   // fondo claro → logo y etiqueta oscuros
    const darkInk = lum(e.ink) < 150;                   // texto oscuro → etiqueta de fecha clara
    return `<article class="card ${darkInk ? "light" : ""}" style="--c1:${e.c1};--c2:${e.c2};--cink:${e.ink}" aria-label="${e.name}, ${date}">
      <div class="glow"></div>
      <img class="brand" src="assets/brand/${lightBg ? "samplia-logo.png" : "samplia-logo-white.png"}" alt="Samplia">
      <svg class="m" viewBox="0 0 200 200" aria-hidden="true">${M[e.motif] || ""}</svg>
      <div class="txt"><span class="date">${date}</span><div class="name">${e.name}</div><div class="fit">${e.fit}</div></div>
    </article>`;
  };

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (params.get("still") === "1") document.body.classList.add("still");
  if (id) {
    document.body.classList.add("single");
    const e = EVENTS.find(x => x.date === id);
    document.getElementById("grid").innerHTML = e ? card(e) : "";
  } else {
    document.getElementById("grid").innerHTML = EVENTS.map(card).join("");
    document.getElementById("seasons").innerHTML = SEASONS.map(s => `<span><b>${s.name}</b> · ${s.range} · ${s.fit}</span>`).join("");
  }
})();
</script>
</body>
</html>
